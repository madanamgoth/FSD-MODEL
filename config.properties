# =============================================================================
# FSD RAG — configuration properties (Windows / local defaults)
# On OCI, copy config.properties.example and set absolute /mmoneyhome paths.
# =============================================================================

# --- Folders ---
# Model X INPUT: raw FSD library (.docx) — NOT in GitLab
fsd.dir=data/fsds/FSD

# Model X OUTPUT: streamlined Markdown — NOT in GitLab
normalized.dir=data/normalized

# Model Y / ingest INPUT: index these files (X output)
ingest.dir=data/normalized

# Comma-separated folder names to skip under fsd.dir / ingest.dir
fsd.exclude.dirs=

# Chroma vector index — NOT in GitLab (created on server)
index.dir=data/index

# Model Y OUTPUT: new FSD drafts — NOT in GitLab
output.dir=data/output

# SQLite tracker (normalize / ingest / generate / feedback / unlearn) — NOT in GitLab
app.db=data/app.db

# --- Stage switches (Y/N) — you still run the scripts manually ---
# N → that script prints and exits (no Ollama)
normalize.enabled=Y
ingest.enabled=Y

# --- Embedding model (search) ---
# ollama pull nomic-embed-text
embedding.model=nomic-embed-text

# --- Ollama ---
ollama.base.url=http://127.0.0.1:11434

# Model Y — generator (fast, small)
# ollama pull qwen2.5:1.5b
ollama.model=qwen2.5:1.5b
ollama.timeout.seconds=300

# Model X — normalizer / sorter (better quality, slower)
# ollama pull qwen2.5:7b
# Fallback if 7b is too slow: qwen2.5:3b
normalize.model=qwen2.5:7b
normalize.timeout.seconds=600
# Max characters sent to Model X per section-window
normalize.window.chars=2800
normalize.window.overlap=200

# --- Chunking (ingest of normalized .md) ---
chunk.size=1200
chunk.overlap=150
retrieve.top.k=6

chroma.collection=fsd_chunks
generate.out.prefix=fsd_draft
